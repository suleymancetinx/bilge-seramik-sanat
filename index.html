<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"/>
<title>Pottery Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<style>
/* ── Reset ── */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#111;color:#e5e2e1;font-family:'Inter',sans-serif}

/* ── Material icons ── */
.mi{font-family:'Material Symbols Outlined';font-style:normal;font-size:22px;line-height:1;
    letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-smoothing:antialiased;
    font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;display:inline-block}

/* ── THREE canvas – truly fullscreen behind everything ── */
#c3d{
  position:fixed;top:0;left:0;
  width:100vw;height:100vh;   /* CSS size matches window */
  z-index:0;
  touch-action:none;
  display:block;
}
#pc{display:none}

/* ── Glassmorphism base ── */
.g{
  background:rgba(14,11,9,.78);
  border:1px solid rgba(255,255,255,.09);
  backdrop-filter:blur(28px);
  -webkit-backdrop-filter:blur(28px);
}

/* ════════════════════════════
   TOP TOOLBAR
════════════════════════════ */
#tb{
  position:fixed;top:12px;left:50%;transform:translateX(-50%);
  display:flex;align-items:center;gap:2px;
  padding:5px 8px;border-radius:999px;
  z-index:100;                          /* highest — always on top */
  box-shadow:0 4px 20px rgba(0,0,0,.55);
  white-space:nowrap;
}

/* icon buttons in toolbar */
.ib{
  position:relative;
  width:40px;height:40px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;border:none;background:transparent;
  color:rgba(218,193,184,.55);transition:background .15s,color .15s;
}
.ib:hover{background:rgba(255,255,255,.08);color:#dac1b8}
.ib.hi{background:rgba(160,82,45,.82);color:#250e00;box-shadow:0 0 10px rgba(255,181,150,.35)}
.ib.hi .mi{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24}

.tsep{width:1px;height:20px;background:rgba(255,255,255,.1);margin:0 3px;flex-shrink:0}

/* status badge */
#sbadge{
  padding:0 8px;font-size:10px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:#ffb596;white-space:nowrap;
  display:flex;align-items:center;gap:5px;
}
.dot{width:6px;height:6px;border-radius:50%;background:#D2B48C;flex-shrink:0;
  animation:blink 2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

/* ════════════════════════════
   POPOVER  (fixed — NOT child of toolbar, avoids clipping)
════════════════════════════ */
.pop{
  position:fixed;
  top:64px;                             /* below toolbar */
  min-width:200px;
  border-radius:16px;padding:14px;
  z-index:99;
  display:none;flex-direction:column;gap:10px;
  box-shadow:0 8px 32px rgba(0,0,0,.65);
}
.pop.open{display:flex}

/* anchor variants */
.pop-c{left:50%;transform:translateX(-50%)}
.pop-l{left:12px}
.pop-r{right:12px}

/* section micro-label */
.sl{font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
    color:rgba(218,193,184,.4)}
.hr{height:1px;background:rgba(255,255,255,.07);width:100%}

/* ── Tool buttons inside popover ── */
.tb3{display:flex;gap:6px}
.tpb{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:10px 4px;border-radius:12px;cursor:pointer;border:none;
  background:rgba(255,255,255,.05);color:rgba(218,193,184,.6);transition:all .15s;
}
.tpb:hover{background:rgba(255,255,255,.1);color:#dac1b8}
.tpb.hi{background:rgba(160,82,45,.8);color:#250e00}
.tpb.hi .mi{font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24}
.tpb span:not(.mi){font-size:9px;font-weight:700;letter-spacing:.07em;text-transform:uppercase}

/* ── Brush size ── */
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;cursor:pointer;width:100%}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:14px;height:14px;border-radius:50%;
  background:#ffb596;box-shadow:0 0 5px rgba(255,181,150,.5)}
input[type=range]::-webkit-slider-runnable-track{
  height:3px;border-radius:2px;background:rgba(255,255,255,.15)}

.szrow{display:flex;align-items:center;gap:10px}
#szprev{width:20px;height:20px;border-radius:50%;background:#E2725B;
  flex-shrink:0;transition:all .2s}

/* ── Color swatches ── */
.sw-grid{display:flex;flex-wrap:wrap;gap:7px}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid transparent;
    cursor:pointer;transition:all .15s;flex-shrink:0}
.sw:hover{transform:scale(1.12)}
.sw.hi{border-color:#ffb596;transform:scale(1.2);box-shadow:0 0 8px rgba(255,181,150,.5)}

.cprow{display:flex;align-items:center;gap:10px}
.cpwrap{position:relative;width:32px;height:32px;border-radius:50%;flex-shrink:0;
  background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red)}
.cpwrap input[type=color]{
  -webkit-appearance:none;opacity:0;position:absolute;inset:0;
  width:100%;height:100%;border-radius:50%;cursor:pointer;border:none}
#cprev{flex:1;height:26px;border-radius:8px;background:#E2725B;
  border:1px solid rgba(255,255,255,.1);transition:background .15s}

/* ── Glaze ── */
.gb{
  width:100%;padding:8px;border-radius:10px;font-size:12px;font-weight:700;
  cursor:pointer;border:2px solid transparent;transition:all .15s;text-align:center;
}
.gb.hi{border-color:#ffb596;box-shadow:0 0 8px rgba(255,181,150,.3)}
.gnote{font-size:10px;color:rgba(218,193,184,.4);line-height:1.4}

/* ════════════════════════════
   RIGHT DRAWER + TOGGLE
════════════════════════════ */
#dtog{
  position:fixed;right:0;top:50%;transform:translateY(-50%);
  width:28px;height:72px;
  border-radius:10px 0 0 10px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  cursor:pointer;border:none;z-index:98;
  box-shadow:-2px 0 12px rgba(0,0,0,.4);
  transition:right .3s cubic-bezier(.32,.72,0,1);
}
#dtog .mi{font-size:16px;color:#ffb596}
#dtog .dl{font-size:7px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:rgba(218,193,184,.45);writing-mode:vertical-lr;transform:rotate(180deg)}

#drw{
  position:fixed;right:0;top:0;bottom:0;width:164px;
  border-radius:14px 0 0 14px;
  transform:translateX(100%);
  transition:transform .3s cubic-bezier(.32,.72,0,1);
  z-index:97;
  display:flex;flex-direction:column;
  box-shadow:-4px 0 24px rgba(0,0,0,.5);
  overflow:hidden;
}
#drw.open{transform:translateX(0)}
#drw.open ~ #dtog{right:164px}

#drwi{
  flex:1;overflow-y:auto;padding:14px 10px 20px;
  display:flex;flex-direction:column;gap:12px;
}
#drwi::-webkit-scrollbar{width:3px}
#drwi::-webkit-scrollbar-thumb{background:rgba(255,181,150,.2);border-radius:2px}

/* drawer header */
.dh{display:flex;justify-content:space-between;align-items:center;flex-shrink:0;padding:12px 10px 0}
.dh-title{font-size:13px;font-weight:600;color:#ffb596}
.dh-close{background:none;border:none;cursor:pointer;
  display:flex;align-items:center;color:rgba(218,193,184,.5)}
.dh-close .mi{font-size:20px}

/* ── Vase grid ── */
.vg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.vb{
  display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:8px 4px;border-radius:10px;cursor:pointer;
  border:1px solid rgba(255,255,255,.07);background:rgba(255,255,255,.04);
  transition:all .15s;
}
.vb:hover{background:rgba(255,255,255,.09)}
.vb.hi{background:rgba(160,82,45,.28);border-color:rgba(255,181,150,.4)}
.vb svg{color:#ffb596;opacity:.5;transition:opacity .15s;fill:currentColor}
.vb.hi svg,.vb:hover svg{opacity:1}
.vb .vn{font-size:9px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  color:rgba(218,193,184,.5);transition:color .15s}
.vb.hi .vn{color:#ffb596}

/* ── Pattern grid ── */
.pg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pb{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:8px 4px;border-radius:10px;cursor:pointer;
  border:1px solid rgba(255,255,255,.07);background:rgba(255,255,255,.04);
  transition:all .15s;
}
.pb:hover{background:rgba(255,255,255,.09)}
.pb.hi{background:rgba(160,82,45,.28);border-color:rgba(255,181,150,.4)}
.pb .mi{font-size:18px;color:#ffb596}
.pb .pn{font-size:9px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  color:rgba(218,193,184,.5)}
.pb.hi .pn{color:#ffb596}
.pb-full{grid-column:span 2}

/* density row */
.dr{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.dv{font-size:10px;font-weight:700;color:#ffb596;min-width:28px;text-align:right}
</style>
</head>
<body>

<!-- THREE.JS canvas — always fullscreen behind UI -->
<canvas id="c3d"></canvas>
<!-- Hidden 2D paint surface -->
<canvas id="pc" width="1024" height="1024"></canvas>


<!-- ══════════════════════════════════════
     TOP TOOLBAR (z-index:100)
══════════════════════════════════════ -->
<div id="tb" class="g">

  <!-- Play/Pause -->
  <button class="ib hi" id="btnPlay" title="Döndür/Durdur">
    <span class="mi">pause</span>
  </button>

  <div class="tsep"></div>

  <!-- Tools trigger -->
  <button class="ib hi" id="btnTools" title="Araçlar">
    <span class="mi">brush</span>
  </button>

  <!-- Colors trigger -->
  <button class="ib" id="btnColors" title="Renkler">
    <span class="mi">palette</span>
  </button>

  <!-- Glaze trigger -->
  <button class="ib" id="btnGlaze" title="Kaplama">
    <span class="mi">auto_awesome</span>
  </button>

  <div class="tsep"></div>

  <!-- Undo -->
  <button class="ib" id="btnUndo" title="Geri Al">
    <span class="mi">undo</span>
  </button>
  <!-- Clear -->
  <button class="ib" id="btnClear" title="Temizle">
    <span class="mi">delete_sweep</span>
  </button>

  <div class="tsep"></div>

  <!-- Status -->
  <div id="sbadge">
    <span class="dot"></span>
    <span id="mlabel">Fırça</span>
  </div>

</div>


<!-- ══════════════════════════════════════
     POPOVERS — fixed, z-index:99
     (NOT inside toolbar — avoids clipping)
══════════════════════════════════════ -->

<!-- Tools popover -->
<div class="pop g pop-l" id="popTools">
  <span class="sl">Araç</span>
  <div class="tb3">
    <button class="tpb hi" data-tool="brush">
      <span class="mi">brush</span><span>Fırça</span>
    </button>
    <button class="tpb" data-tool="eraser">
      <span class="mi">ink_eraser</span><span>Silgi</span>
    </button>
    <button class="tpb" data-tool="stamp">
      <span class="mi">auto_fix_high</span><span>Stamp</span>
    </button>
  </div>
  <div class="hr"></div>
  <span class="sl">Kalınlık</span>
  <div class="szrow">
    <input type="range" id="bsz" min="2" max="60" value="14" style="flex:1"/>
    <div id="szprev"></div>
  </div>
</div>

<!-- Colors popover -->
<div class="pop g pop-c" id="popColors">
  <span class="sl">Renk</span>
  <div class="sw-grid">
    <button class="sw hi" data-c="#E2725B" style="background:#E2725B"></button>
    <button class="sw"    data-c="#000080" style="background:#000080"></button>
    <button class="sw"    data-c="#228B22" style="background:#228B22"></button>
    <button class="sw"    data-c="#FFDB58" style="background:#FFDB58"></button>
    <button class="sw"    data-c="#FFFFFF" style="background:#fff;border-color:rgba(255,255,255,.3)"></button>
    <button class="sw"    data-c="#4B9CD3" style="background:#4B9CD3"></button>
    <button class="sw"    data-c="#C0392B" style="background:#C0392B"></button>
    <button class="sw"    data-c="#9B59B6" style="background:#9B59B6"></button>
    <button class="sw"    data-c="#1ABC9C" style="background:#1ABC9C"></button>
    <button class="sw"    data-c="#F39C12" style="background:#F39C12"></button>
    <button class="sw"    data-c="#ECF0F1" style="background:#ECF0F1;border-color:rgba(255,255,255,.3)"></button>
    <button class="sw"    data-c="#131313" style="background:#131313;border-color:rgba(255,255,255,.2)"></button>
  </div>
  <div class="hr"></div>
  <span class="sl">Özel Renk</span>
  <div class="cprow">
    <div class="cpwrap">
      <input type="color" id="cpick" value="#E2725B"/>
    </div>
    <div id="cprev"></div>
  </div>
</div>

<!-- Glaze popover -->
<div class="pop g pop-r" id="popGlaze">
  <span class="sl">Tam Kaplama</span>
  <button id="gGold"   class="gb" style="background:linear-gradient(135deg,#C8960C,#F9E272);color:#3a2800">✦ Gold</button>
  <button id="gSilver" class="gb" style="background:linear-gradient(135deg,#999,#e0e0e0);color:#222">◈ Silver</button>
  <button id="gMatte"  class="gb" style="background:rgba(255,255,255,.9);color:#222">○ Matte White</button>
  <p class="gnote">Kaplama üzerine fırça ile boyayabilirsin.</p>
</div>


<!-- ══════════════════════════════════════
     DRAWER TOGGLE TAB
══════════════════════════════════════ -->
<button id="dtog" class="g" aria-label="Model ve Desen">
  <span class="mi">chevron_left</span>
  <span class="dl">Model</span>
</button>


<!-- ══════════════════════════════════════
     RIGHT DRAWER  (z-index:97)
══════════════════════════════════════ -->
<div id="drw" class="g">

  <div class="dh">
    <span class="dh-title">Model &amp; Desen</span>
    <button class="dh-close" id="dClose">
      <span class="mi">chevron_right</span>

  <div id="drwi">

    <!-- Vase models -->
    <span class="sl">Çömlek</span>
    <div class="vg">

      <button class="vb hi" data-v="0">
        <svg viewBox="0 0 28 52" width="28" height="38"><path d="M14 52C7 52 3 49 2 44 1 39 2 34 4 27 6 21 8 16 9 10 10 5 10 2 12 1 13 0 14 0 15 0 16 1 18 2 18 5 19 10 20 16 22 21 24 27 26 34 27 39 26 44 25 49 21 52Z"/></svg>

      <button class="vb" data-v="1">
        <svg viewBox="0 0 28 52" width="28" height="38"><path d="M14 52C8 52 3 49 2 43 1 37 2 30 5 23 8 16 9 11 9 7 9 3 10 1 12 0 14 0 16 0 18 1 19 3 19 7 19 11 20 16 23 23 26 30 27 37 26 43 25 49 20 52Z"/></svg>
        <span class="vn">Küre</span>
      </button>

      <button class="vb" data-v="2">
        <svg viewBox="0 0 28 52" width="28" height="38"><path d="M14 52C9 52 5 49 4 44 3 39 4 31 5 23 5 15 6 8 7 4 8 1 10 0 14 0 18 0 20 1 21 4 22 8 23 15 23 23 24 31 25 39 24 44 23 49 19 52Z"/></svg>
        <span class="vn">Silindir</span>
      </button>

      <button class="vb" data-v="3">
        <svg viewBox="0 0 28 52" width="28" height="38"><path d="M14 52C6 52 2 48 1 42 0 36 2 29 5 22 8 15 9 10 9 6 10 2 11 0 14 0 17 0 18 2 19 6 19 10 20 15 23 22 26 29 28 36 27 42 26 48 22 52Z"/></svg>
        <span class="vn">Elips</span>
      </button>

      <button class="vb" data-v="4">
        <svg viewBox="0 0 28 52" width="28" height="38"><path d="M14 52C7 52 2 49 1 43 0 37 2 30 5 23 8 16 9 11 9 6 9 2 10 0 14 0 18 0 19 2 19 6 19 11 20 16 23 23 26 30 28 37 27 43 26 49 21 52Z"/></svg>
        <span class="vn">Çan</span>
      </button>

      <button class="vb" data-v="5">
        <svg viewBox="0 0 28 52" width="28" height="38"><path d="M14 52C6 52 1 47 0 40-1 33 2 26 5 19 8 12 9 8 9 5 10 1 11 0 14 0 17 0 18 1 19 5 19 8 20 12 23 19 26 26 29 33 28 40 27 47 22 52Z"/></svg>
        <span class="vn">Damacana</span>
      </button>

    </div>

    <div class="hr"></div>

    <!-- Patterns -->
    <span class="sl">Desen</span>
    <div class="pg">
      <button class="pb hi" data-p="none">
        <span class="mi">brush</span><span class="pn">Solid</span>
      </button>
      <button class="pb" data-p="wave">
        <span class="mi">waves</span><span class="pn">Su Yolu</span>
      </button>
      <button class="pb" data-p="dots">
        <span class="mi">grain</span><span class="pn">Nokta</span>
      </button>
      <button class="pb" data-p="squares">
        <span class="mi">grid_view</span><span class="pn">Kare</span>
      </button>
      <button class="pb pb-full" data-p="diamonds">
        <span class="mi">diamond</span><span class="pn">Dörtgen</span>
      </button>
    </div>

    <!-- Density -->
    <div class="dr">
      <span class="sl">Yoğunluk</span>
      <input type="range" id="pdens" min="10" max="100" value="50" style="flex:1;min-width:0"/>
      <span class="dv" id="dlabel">50%</span>
    </div>

  </div>
</div>


<!-- ══════════════════════════════════════
     THREE.JS + PAINT ENGINE
══════════════════════════════════════ -->
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js';

// ─── 1. RENDERER ────────────────────────────────────────────────
const c3d = document.getElementById('c3d');

// Set both the canvas CSS size AND the renderer draw-buffer size
function W(){ return window.innerWidth  }
function H(){ return window.innerHeight }

const renderer = new THREE.WebGLRenderer({ canvas: c3d, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(W(), H());   // sets drawBuffer size
c3d.style.width  = W() + 'px';   // sets CSS display size
c3d.style.height = H() + 'px';

renderer.shadowMap.enabled = true;
renderer.shadowMap.type    = THREE.PCFSoftShadowMap;
renderer.toneMapping       = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;

// ─── 2. SCENE / CAMERA ──────────────────────────────────────────
const scene  = new THREE.Scene();
scene.background = new THREE.Color(0x0f0d0b);

const camera = new THREE.PerspectiveCamera(44, W()/H(), 0.1, 100);
camera.position.set(0, 1.6, 4.6);
camera.lookAt(0, 0.95, 0);

// ─── 3. LIGHTS ──────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0xfff0e0, 0.7));

const kl = new THREE.DirectionalLight(0xffeedd, 2.2);
kl.position.set(3, 6, 4);
kl.castShadow = true;
kl.shadow.mapSize.set(2048, 2048);
scene.add(kl);

const fl = new THREE.DirectionalLight(0x8899cc, 0.5);
fl.position.set(-4, 2, -2);
scene.add(fl);

const rl = new THREE.DirectionalLight(0xff7744, 0.4);
rl.position.set(0, 3, -5);
scene.add(rl);

// ─── 4. TURNTABLE ───────────────────────────────────────────────
const ttMat = new THREE.MeshStandardMaterial({ color:0x282420, roughness:0.75, metalness:0.2 });
const tt    = new THREE.Mesh(new THREE.CylinderGeometry(1.7,1.7,0.07,72), ttMat);
tt.position.y = -0.035;
tt.receiveShadow = true;
scene.add(tt);

// Ring — child of tt so it spins with it
const ring = new THREE.Mesh(
  new THREE.TorusGeometry(1.35,0.012,8,80),
  new THREE.MeshStandardMaterial({color:0x554433,roughness:0.4,metalness:0.5})
);
ring.rotation.x = Math.PI/2;
ring.position.y = 0.075;
tt.add(ring);

// Shadow catcher
const sp = new THREE.Mesh(
  new THREE.PlaneGeometry(20,20),
  new THREE.ShadowMaterial({opacity:0.4})
);
sp.rotation.x = -Math.PI/2;
sp.position.y = -0.04;
sp.receiveShadow = true;
scene.add(sp);

// ─── 5. PAINT CANVAS + TEXTURE ──────────────────────────────────
const pc  = document.getElementById('pc');
const ctx = pc.getContext('2d');
ctx.fillStyle = '#A0522D';
ctx.fillRect(0,0,1024,1024);

const tex = new THREE.CanvasTexture(pc);
tex.anisotropy = renderer.capabilities.getMaxAnisotropy();

// ─── 6. CATMULL-ROM SPLINE ──────────────────────────────────────
// Smooths sparse control points into 200-sample silhouette → no visible facets
function catmull(pts, n){
  const out=[], l=pts.length;
  for(let s=0;s<n;s++){
    const t=(s/(n-1))*(l-1), i=Math.floor(t), f=t-i;
    const p0=pts[Math.max(0,i-1)], p1=pts[i],
          p2=pts[Math.min(l-1,i+1)], p3=pts[Math.min(l-1,i+2)];
    const x=.5*(2*p1.x+(-p0.x+p2.x)*f+(2*p0.x-5*p1.x+4*p2.x-p3.x)*f*f+(-p0.x+3*p1.x-3*p2.x+p3.x)*f*f*f);
    const y=.5*(2*p1.y+(-p0.y+p2.y)*f+(2*p0.y-5*p1.y+4*p2.y-p3.y)*f*f+(-p0.y+3*p1.y-3*p2.y+p3.y)*f*f*f);
    out.push(new THREE.Vector2(Math.max(0.015,x),y));
  }
  return out;
}

// ─── 7. VASE PROFILES ───────────────────────────────────────────
const VASES=[
  [[0.58,0],[0.72,.10],[0.80,.28],[0.82,.52],[0.80,.76],[0.74,1.00],[0.62,1.20],[0.44,1.40],[0.26,1.58],[0.20,1.75],[0.22,1.90],[0.20,2.00]],
  [[0.50,0],[0.68,.08],[0.82,.22],[0.88,.44],[0.86,.68],[0.76,.90],[0.56,1.10],[0.32,1.30],[0.18,1.52],[0.15,1.72],[0.18,1.88],[0.16,2.00]],
  [[0.56,0],[0.64,.06],[0.66,.28],[0.67,.52],[0.67,.78],[0.66,1.00],[0.62,1.22],[0.50,1.44],[0.28,1.62],[0.18,1.78],[0.20,1.92],[0.18,2.00]],
  [[0.52,0],[0.72,.12],[0.86,.32],[0.90,.58],[0.86,.84],[0.72,1.06],[0.52,1.24],[0.30,1.44],[0.16,1.66],[0.13,1.84],[0.15,1.96],[0.13,2.04]],
  [[0.60,0],[0.76,.10],[0.84,.26],[0.82,.50],[0.72,.72],[0.56,.92],[0.34,1.14],[0.20,1.38],[0.16,1.60],[0.14,1.78],[0.18,1.92],[0.17,2.02]],
  [[0.54,0],[0.76,.08],[0.90,.24],[0.94,.48],[0.88,.72],[0.70,.94],[0.44,1.14],[0.24,1.38],[0.16,1.62],[0.14,1.80],[0.16,1.95],[0.14,2.05]],
].map(r=>r.map(([x,y])=>new THREE.Vector2(x,y)));

function buildGeo(i){
  const g=new THREE.LatheGeometry(catmull(VASES[i],200),160);
  g.computeVertexNormals(); return g;
}

const pmat = new THREE.MeshStandardMaterial({map:tex,roughness:.55,metalness:.05,side:THREE.FrontSide});
const pot  = new THREE.Mesh(buildGeo(0), pmat);
pot.position.y=.02; pot.castShadow=pot.receiveShadow=true;

const cap = new THREE.Mesh(
  new THREE.CircleGeometry(VASES[0][0].x,128),
  new THREE.MeshStandardMaterial({color:0x7a3a18,roughness:.8,metalness:0})
);
cap.rotation.x=-Math.PI/2; cap.position.y=.021;

const pivot=new THREE.Group();
pivot.add(pot); pivot.add(cap);
scene.add(pivot);

// ─── 8. APP STATE ───────────────────────────────────────────────
let spinning=true, painting=false;
let color='#E2725B', bsz=14, tool='brush', pattern='none', density=50, lastUV=null;
const undo=[];
function pushUndo(){ undo.push(ctx.getImageData(0,0,1024,1024)); if(undo.length>20)undo.shift(); }

// ─── 9. RAYCASTER / PAINT ───────────────────────────────────────
const rc=new THREE.Raycaster(), ndc=new THREE.Vector2();

function toNDC(e){
  const t=e.touches?e.touches[0]:e;
  ndc.x=(t.clientX/W())*2-1; ndc.y=-(t.clientY/H())*2+1;
}

function paintAt(e){
  if(!painting) return;
  toNDC(e);
  rc.setFromCamera(ndc,camera);
  scene.updateMatrixWorld(true);
  const h=rc.intersectObject(pot,false);
  if(!h.length||!h[0].uv) return;
  const uv=h[0].uv;
  const x=uv.x*1024, y=(1-uv.y)*1024;
  const prev=lastUV?{x:lastUV.x*1024,y:(1-lastUV.y)*1024}:null;
  tool==='eraser'?erase(x,y):pattern!=='none'?stamp(x,y,prev):brush(x,y,prev);
  lastUV=uv.clone();
  tex.needsUpdate=true;
}

function brush(x,y,p){
  ctx.globalCompositeOperation='source-over';
  ctx.strokeStyle=ctx.fillStyle=color; ctx.lineWidth=bsz; ctx.lineCap=ctx.lineJoin='round';
  if(p){ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(x,y);ctx.stroke();}
  else{ctx.beginPath();ctx.arc(x,y,bsz/2,0,Math.PI*2);ctx.fill();}
}
function erase(x,y){
  ctx.globalCompositeOperation='source-over';
  ctx.fillStyle='#A0522D'; ctx.beginPath(); ctx.arc(x,y,bsz,0,Math.PI*2); ctx.fill();
}
function stamp(x,y,p){
  ctx.globalCompositeOperation='source-over'; ctx.fillStyle=ctx.strokeStyle=color;
  ctx.lineWidth=Math.max(1,bsz*.15);
  const g=Math.max(4,105-density);
  if(!p){sh(x,y);return;}
  const dx=x-p.x,dy=y-p.y,d=Math.sqrt(dx*dx+dy*dy),st=Math.max(1,Math.floor(d/g));
  for(let i=0;i<=st;i++) sh(p.x+dx*i/st, p.y+dy*i/st);
}
function sh(x,y){
  const s=bsz*.75; ctx.save(); ctx.translate(x,y);
  if(pattern==='dots'){ctx.beginPath();ctx.arc(0,0,s/2,0,Math.PI*2);ctx.fill();}
  else if(pattern==='squares'){ctx.fillRect(-s/2,-s/2,s,s);}
  else if(pattern==='diamonds'){ctx.beginPath();ctx.moveTo(0,-s*.65);ctx.lineTo(s*.5,0);ctx.lineTo(0,s*.65);ctx.lineTo(-s*.5,0);ctx.closePath();ctx.fill();}
  else if(pattern==='wave'){
    const w=s*1.4,a=s*.38; ctx.beginPath();
    for(let i=0;i<=20;i++){const tx=(i/20)*w-w/2,ty=Math.sin((i/20)*Math.PI*2)*a; i?ctx.lineTo(tx,ty):ctx.moveTo(tx,ty);}
    ctx.stroke();
  }
  ctx.restore();
}

// ─── 10. POINTER EVENTS ─────────────────────────────────────────
function dn(e){ if(e.target!==c3d)return; painting=true; lastUV=null; pushUndo(); paintAt(e); }
function mv(e){ if(!painting)return; e.preventDefault(); paintAt(e); }
function up(){ painting=false; lastUV=null; }

c3d.addEventListener('mousedown',dn);
c3d.addEventListener('mousemove',mv);
c3d.addEventListener('mouseup',up);
c3d.addEventListener('mouseleave',up);
c3d.addEventListener('touchstart',dn,{passive:false});
c3d.addEventListener('touchmove',mv,{passive:false});
c3d.addEventListener('touchend',up,{passive:false});

// ─── 11. RESIZE ─────────────────────────────────────────────────
window.addEventListener('resize',()=>{
  renderer.setSize(W(),H());
  c3d.style.width=W()+'px'; c3d.style.height=H()+'px';
  camera.aspect=W()/H(); camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
});

// ─── 12. LOOP ───────────────────────────────────────────────────
const clk=new THREE.Clock();
(function loop(){
  requestAnimationFrame(loop);
  const dt=clk.getDelta();
  if(spinning){ pivot.rotation.y+=dt*.42; tt.rotation.y+=dt*.42; }
  renderer.render(scene,camera);
})();

// ─── 13. MATERIAL HELPERS ───────────────────────────────────────
function restoreClay(){
  pmat.color.set(0xffffff); pmat.metalness=.05; pmat.roughness=.55;
  pmat.map=tex; pmat.needsUpdate=true;
  document.querySelectorAll('.gb').forEach(b=>b.classList.remove('hi'));
}

// ─── 14. UI WIRING ──────────────────────────────────────────────

// Popover system — popovers are FIXED elements, no clipping issue
const POPS={ tools:'popTools', colors:'popColors', glaze:'popGlaze' };
function closeAll(){ Object.values(POPS).forEach(id=>document.getElementById(id).classList.remove('open')); }

['Tools','Colors','Glaze'].forEach(name=>{
  document.getElementById('btn'+name).addEventListener('click', e=>{
    e.stopPropagation();
    const pid=POPS[name.toLowerCase()];
    const pop=document.getElementById(pid);
    const was=pop.classList.contains('open');
    closeAll();
    if(!was) pop.classList.add('open');
  });
});

document.addEventListener('click', e=>{
  if(!e.target.closest('.pop') && !e.target.closest('.ib')) closeAll();
});

// Play/Pause
document.getElementById('btnPlay').addEventListener('click',()=>{
  spinning=!spinning;
  document.querySelector('#btnPlay .mi').textContent=spinning?'pause':'play_arrow';
  document.getElementById('btnPlay').classList.toggle('hi',spinning);
});

// Tool buttons
const mlabel=document.getElementById('mlabel');
const TLABELS={brush:'Fırça',eraser:'Silgi',stamp:'Stamp'};
const TICONS={brush:'brush',eraser:'ink_eraser',stamp:'auto_fix_high'};
document.querySelectorAll('[data-tool]').forEach(b=>{
  b.addEventListener('click',()=>{
    tool=b.dataset.tool;
    document.querySelectorAll('[data-tool]').forEach(x=>x.classList.remove('hi'));
    b.classList.add('hi');
    document.querySelector('#btnTools .mi').textContent=TICONS[tool];
    mlabel.textContent=TLABELS[tool];
  });
});

// Brush size
const bszIn=document.getElementById('bsz');
const szprev=document.getElementById('szprev');
bszIn.addEventListener('input',()=>{
  bsz=+bszIn.value;
  const d=Math.max(8,Math.min(36,bsz*.7));
  szprev.style.cssText=`width:${d}px;height:${d}px;background:${color};border-radius:50%;flex-shrink:0;transition:all .2s`;
});
// init
szprev.style.cssText=`width:14px;height:14px;background:${color};border-radius:50%;flex-shrink:0`;

// Color swatches
function setColor(hex){
  color=hex;
  szprev.style.background=hex;
  document.getElementById('cprev').style.background=hex;
  document.getElementById('cpick').value=hex;
  document.getElementById('btnColors').style.color=hex;
}
document.querySelectorAll('.sw').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('.sw').forEach(x=>x.classList.remove('hi'));
    b.classList.add('hi');
    setColor(b.dataset.c);
  });
});
document.getElementById('cpick').addEventListener('input',e=>{
  document.querySelectorAll('.sw').forEach(x=>x.classList.remove('hi'));
  setColor(e.target.value);
});
// init preview
document.getElementById('cprev').style.background=color;

// Glaze
function applyGlaze(col,met,rou){
  document.querySelectorAll('.gb').forEach(b=>b.classList.remove('hi'));
  pmat.color.set(col); pmat.metalness=met; pmat.roughness=rou; pmat.map=tex; pmat.needsUpdate=true;
}
document.getElementById('gGold').addEventListener('click',()=>{ document.getElementById('gGold').classList.add('hi'); applyGlaze(0xC8960C,.25,.65); });
document.getElementById('gSilver').addEventListener('click',()=>{ document.getElementById('gSilver').classList.add('hi'); applyGlaze(0x9E9E9E,.25,.65); });
document.getElementById('gMatte').addEventListener('click',()=>{ document.getElementById('gMatte').classList.add('hi'); applyGlaze(0xFFFFFF,0,.92); });

// Undo
document.getElementById('btnUndo').addEventListener('click',()=>{
  if(!undo.length) return;
  ctx.putImageData(undo.pop(),0,0); tex.needsUpdate=true;
});
// Clear
document.getElementById('btnClear').addEventListener('click',()=>{
  pushUndo(); ctx.fillStyle='#A0522D'; ctx.fillRect(0,0,1024,1024); tex.needsUpdate=true; restoreClay();
});

// Drawer
const drw=document.getElementById('drw');
const dtog=document.getElementById('dtog');
function openDrw()  { drw.classList.add('open'); dtog.querySelector('.mi').textContent='chevron_right'; }
function closeDrw() { drw.classList.remove('open'); dtog.querySelector('.mi').textContent='chevron_left'; }
dtog.addEventListener('click',()=>drw.classList.contains('open')?closeDrw():openDrw());
document.getElementById('dClose').addEventListener('click',closeDrw);

// Vase selector
function switchVase(i){
  pot.geometry.dispose(); pot.geometry=buildGeo(i);
  cap.geometry.dispose(); cap.geometry=new THREE.CircleGeometry(VASES[i][0].x,128);
  ctx.fillStyle='#A0522D'; ctx.fillRect(0,0,1024,1024); tex.needsUpdate=true;
  undo.length=0; restoreClay();
  document.querySelectorAll('.vb').forEach((b,j)=>b.classList.toggle('hi',j===i));
}
document.querySelectorAll('.vb').forEach(b=>{ b.addEventListener('click',()=>switchVase(+b.dataset.v)); });

// Patterns
document.querySelectorAll('.pb').forEach(b=>{
  b.addEventListener('click',()=>{
    pattern=b.dataset.p;
    document.querySelectorAll('.pb').forEach(x=>x.classList.remove('hi'));
    b.classList.add('hi');
    if(pattern!=='none'){
      tool='stamp';
      document.querySelectorAll('[data-tool]').forEach(x=>x.classList.remove('hi'));
      document.querySelector('[data-tool="stamp"]').classList.add('hi');
      document.querySelector('#btnTools .mi').textContent='auto_fix_high';
      mlabel.textContent='Stamp';
    } else {
      tool='brush';
      document.querySelectorAll('[data-tool]').forEach(x=>x.classList.remove('hi'));
      document.querySelector('[data-tool="brush"]').classList.add('hi');
      document.querySelector('#btnTools .mi').textContent='brush';
      mlabel.textContent='Fırça';
    }
  });
});

// Density
document.getElementById('pdens').addEventListener('input',e=>{
  density=+e.target.value; document.getElementById('dlabel').textContent=e.target.value+'%';
});

</script>
</body>
